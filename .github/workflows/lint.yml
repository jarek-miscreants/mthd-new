name: 🔬 Lint Job

env:
    NODE_VERSION: "22.21.0"

on:
    workflow_call:

jobs:
    lint:
        name: 🔍 Code Lint
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true
            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🔍 Lint All Projects
              run: npm run lint
