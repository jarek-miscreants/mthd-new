name: 🔍 PR Review

on:
    pull_request:

permissions:
    id-token: write
    contents: read

jobs:
    lint:
        name: Lint All Projects
        uses: ./.github/workflows/lint.yml

    build:
        name: Build App
        uses: ./.github/workflows/build.yml
        secrets: inherit

    check:
        name: ✅ Check

        needs:
            - lint
            - build

        runs-on: ubuntu-latest

        steps:
            - name: Require all jobs to succeed
              uses: re-actors/alls-green@release/v1
              with:
                  jobs: ${{ toJSON(needs) }}
