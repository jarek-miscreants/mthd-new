name: ⚒️ Build Job

env:
    NODE_VERSION: "22.21.0"

on:
    workflow_call:

jobs:
    build:
        name: 🏗️ Build Process
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: 📦 Install dependencies
              run: npm ci

            # Add Next.js build caching for the frontend
            - name: 💾 Cache Next.js App Build
              uses: actions/cache@v5
              with:
                  path: app/.next/cache
                  key: ${{ runner.os }}-nextjs-app-${{ hashFiles('app/**/*.js', 'app/**/*.jsx', 'app/**/*.ts', 'app/**/*.tsx') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-app-

            - name: 🏗️ Build Next.js App
              env:
                  NEXT_PUBLIC_SITE_URL: https://www.method.security
              run: npm --workspace app run build